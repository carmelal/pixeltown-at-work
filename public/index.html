<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>pixeltown at work</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0c10; color: #c8ccd4; font: 12px/1.4 ui-monospace, Menlo, monospace; overflow: hidden; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  #stage { position: relative; width: min(98vw, calc(94vh * 240 / 136)); aspect-ratio: 240 / 136; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #c { image-rendering: pixelated; cursor: crosshair; }
  #hi { pointer-events: none; }
  #bar { opacity: .55; display: flex; gap: 14px; width: min(98vw, calc(94vh * 240 / 136)); }
  #conn { margin-left: auto; white-space: nowrap; }
  #bar.hidden { display: none; }
  #bar span:hover { opacity: 1; cursor: pointer; }
  #tip { position: fixed; pointer-events: none; background: #14161d; border: 1px solid #2a2e3a; padding: 3px 6px; display: none; white-space: nowrap; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="240" height="136"></canvas><canvas id="hi"></canvas></div>
<div id="bar">
  <span data-ev="commit">commit</span><span data-ev="push">push</span><span data-ev="merge">merge</span><span data-ev="pull">pull</span><span data-ev="rebase">rebase</span><span data-ev="editing">editing</span><span data-ev="idle">idle</span><span data-ev="gathering">gathering</span><span data-ev="nap">nap</span>
  <span data-ev="weather">weather</span><span data-ev="time">time +3h</span><span data-ev="time" data-msg="reset">time reset</span><span data-ev="season">season</span><span data-ev="season" data-msg="reset">season reset</span><span data-ev="bus">bus</span><span data-ev="check_start" data-msg="tests">check start</span><span data-ev="check_pass">check pass</span><span data-ev="check_fail" data-msg="tests">check fail</span><span id="conn">…</span>
</div>
<div id="tip"></div>
<script type="module" src="/js/main.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>pixeltown at work</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0c10; color: #c8ccd4; font: 12px/1.4 ui-monospace, Menlo, monospace; overflow: hidden; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  #stage { position: relative; width: min(98vw, calc(94vh * 240 / 136)); aspect-ratio: 240 / 136; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #c { image-rendering: pixelated; cursor: crosshair; }
  #hi { pointer-events: none; }
  #bar { opacity: .7; display: flex; gap: 14px; width: min(98vw, calc(94vh * 240 / 136)); }
  #conn { margin-left: auto; white-space: nowrap; }
  #bar:not(.dev) details { display: none; }
  #bar { background: #000; padding: 4px 8px; box-sizing: border-box; min-height: 22px; }
  #bar details { position: relative; }
  #bar summary { cursor: pointer; list-style: none; }
  #bar summary::-webkit-details-marker { display: none; }
  #bar summary::after { content: ' ▴'; opacity: .6; }
  #bar details[open] summary::after { content: ' ▾'; }
  #bar .menu { position: absolute; left: 0; bottom: 100%; margin-bottom: 4px; background: #14161d; border: 1px solid #2a2e3a; z-index: 2; display: flex; flex-direction: column; }
  #bar .menu span { padding: 3px 10px; white-space: nowrap; }
  #bar .menu span:hover, #bar summary:hover { cursor: pointer; color: #fff; background: #1e2130; }
  #tip { position: fixed; pointer-events: none; background: #14161d; border: 1px solid #2a2e3a; padding: 3px 6px; display: none; white-space: nowrap; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="240" height="136"></canvas><canvas id="hi"></canvas></div>
<div id="bar">
  <details><summary>git</summary><div class="menu"><span data-ev="commit">commit</span><span data-ev="push">push</span><span data-ev="merge">merge</span><span data-ev="pull">pull</span><span data-ev="rebase">rebase</span><span data-ev="checkout">checkout</span><span data-ev="editing" data-msg="dev">editing</span><span data-ev="idle">idle</span><span data-ev="new" data-msg="x: feature/thing">new</span><span data-ev="stash">stash</span><span data-ev="stash_pop">stash pop</span></div></details>
  <details><summary>checks</summary><div class="menu"><span data-ev="check_start" data-msg="tests">start</span><span data-ev="check_pass">pass</span><span data-ev="check_fail" data-msg="tests">fail</span></div></details>
  <details><summary>server</summary><div class="menu"><span data-ev="server_start">start</span><span data-ev="server_stop">stop</span><span data-ev="up_start">dev up</span></div></details>
  <details><summary>time</summary><div class="menu"><span data-ev="time">+3h</span><span data-ev="time" data-msg="reset">reset</span></div></details>
  <details><summary>season</summary><div class="menu"><span data-ev="season">next</span><span data-ev="season" data-msg="reset">reset</span></div></details>
  <details><summary>town</summary><div class="menu"><span data-ev="gathering">gathering</span><span data-ev="nap">nap</span><span data-ev="weather">weather</span><span data-ev="bus">bus</span></div></details>
  <span id="conn">…</span>
</div>
<div id="tip"></div>
<script type="module" src="/js/main.js"></script>
</body>
</html>

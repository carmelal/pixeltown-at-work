<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>pixeltown at work</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0c10; color: #c8ccd4; font: 12px/1.4 ui-monospace, Menlo, monospace; overflow: hidden; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  #stage { position: relative; width: min(98vw, calc(94vh * 240 / 136)); aspect-ratio: 240 / 136; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #c { image-rendering: pixelated; cursor: crosshair; }
  #hi { pointer-events: none; }
  #bar.hidden { display: none; }
  #tip { position: fixed; pointer-events: none; background: #14161d; border: 1px solid #2a2e3a; padding: 3px 6px; display: none; white-space: nowrap; }
  #bar { opacity: .55; display: flex; gap: 14px; }
  #bar span:hover { opacity: 1; cursor: pointer; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="240" height="136"></canvas><canvas id="hi"></canvas></div>
<div id="bar"><span data-ev="commit">commit</span><span data-ev="push">push</span><span data-ev="incident">incident</span><span data-ev="allclear">all clear</span><span data-ev="party">party</span><span data-ev="nap">nap</span><span data-ev="weather">weather</span><span data-ev="bus">bus</span><span data-ev="geese">geese</span><span id="conn">…</span></div>
<div id="tip"></div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), tip = document.getElementById('tip');
const hi = document.getElementById('hi'), hctx = hi.getContext('2d');   // crisp overlay for text/bubbles
const params = new URLSearchParams(location.search);
if (params.get('dev') !== 'true') document.getElementById('bar').classList.add('hidden');
let S = 1;                                                                 // overlay pixels per world pixel
function fitOverlay() { const r = cv.getBoundingClientRect(), d = devicePixelRatio || 1; hi.width = Math.round(r.width * d); hi.height = Math.round(r.height * d); S = hi.width / 240; }
addEventListener('resize', fitOverlay);
const T = 8, COLS = 30, ROWS = 17, W = COLS * T, H = ROWS * T;
const rnd = (a, b) => a + Math.random() * (b - a), ri = (a, b) => Math.floor(rnd(a, b + 1)), pick = a => a[ri(0, a.length - 1)];
const hash = s => { let h = 2166136261; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
const lerp = (a, b, t) => a + (b - a) * t, clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- time, season, weather ----------
const hourNow = () => { const d = new Date(); return d.getHours() + d.getMinutes() / 60; };
const TZ = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
const southern = /^(Australia|Pacific\/(Auckland|Fiji|Tongatapu|Chatham|Port_Moresby)|America\/(Sao_Paulo|Argentina|Buenos_Aires|Santiago|Montevideo|Lima|La_Paz|Asuncion)|Africa\/(Johannesburg|Maputo|Harare|Windhoek|Lusaka|Gaborone)|Antarctica|Indian\/(Mauritius|Reunion))/.test(TZ);
function seasonFor(d) { let m = d.getMonth(); if (southern) m = (m + 6) % 12; return m === 11 || m < 2 ? 'winter' : m < 5 ? 'spring' : m < 8 ? 'summer' : 'autumn'; }
const SEASON = seasonFor(new Date());
const SUN = { winter: [7.5, 17], spring: [6.5, 19.5], summer: [5.5, 21], autumn: [7, 18.5] }[SEASON];   // sunrise, sunset
function night() { const h = hourNow(), [rise, set] = SUN; if (h < rise - 1 || h > set + 1) return 1; if (h < rise + 1) return (rise + 1 - h) / 2; if (h > set - 1) return (h - set + 1) / 2; return 0; }
const PAL = {   // grass, tree canopy, snow on ground
  spring: { grass: [92, 150, 60], tree: [70, 140, 60], snow: false },
  summer: { grass: [74, 128, 56], tree: [34, 104, 44], snow: false },
  autumn: { grass: [120, 118, 50], tree: [170, 90, 30], snow: false },
  winter: { grass: [200, 205, 215], tree: [60, 50, 40], snow: true },
}[SEASON];
const weather = { type: 'clear', until: 0 };      // clear | cloudy | rain | snow
function rollWeather(force) {
  const r = Math.random();
  weather.type = force || (r < 0.45 ? 'clear' : r < 0.75 ? 'cloudy' : SEASON === 'winter' ? 'snow' : 'rain');
  weather.until = performance.now() + rnd(60, 180) * 1000;
}
rollWeather(); if (Math.random() < 0.6) weather.type = 'clear';
const wet = () => weather.type === 'rain' || weather.type === 'snow';
const WICON = { clear: '☀️', cloudy: '☁️', rain: '🌧️', snow: '❄️' };

// ---------- map ----------
// type, col, row, width (tiles); all buildings are 3 tiles tall
const B = (type, c, r, w, hue = ri(0, 359)) => ({ type, c, r, w, h: 3, hue, lit: false, chimney: type === 'house' && Math.random() < 0.7 });
const buildings = [
  // top row: one gap at col 15 connects the footpath to the back alley
  B('office', 0, 3, 3), B('house', 3, 3, 2), B('house', 5, 3, 2), B('cafe', 7, 3, 3), B('house', 10, 3, 2), B('shop', 12, 3, 3),
  B('house', 16, 3, 2), B('office', 18, 3, 4), B('house', 22, 3, 2), B('hall', 24, 3, 4), B('house', 28, 3, 2),
  // middle row: solid on both sides of the plaza
  B('house', 0, 7, 2), B('house', 2, 7, 2), B('shop', 4, 7, 3), B('house', 7, 7, 2), B('cafe', 21, 7, 3), B('house', 24, 7, 2), B('house', 26, 7, 2), B('house', 28, 7, 2),
  // bottom row: gaps at cols 7 and 18 lead down to the park
  B('shop', 0, 11, 3), B('house', 3, 11, 2), B('house', 5, 11, 2), B('office', 8, 11, 3), B('house', 11, 11, 2), B('house', 13, 11, 2), B('shop', 15, 11, 3),
  B('house', 19, 11, 2), B('house', 21, 11, 2), B('office', 23, 11, 3), B('house', 26, 11, 2), B('house', 28, 11, 2),
];
const fountain = { c: 14, r: 7 };                         // 2x2
const pond = { c: 0, r: 15, w: 14, h: 2 };                       // bottom-left, bleeds off the left and bottom edges
const benches = [[11, 8], [18, 8], [2, 14], [10, 14], [15, 15], [26, 14]];
const trees = [[14, 15], [16, 15], [17, 15], [16, 8], [12, 7], [10, 7], [19, 7], [4, 2], [9, 2], [21, 2], [27, 2]];   // bank, plaza, and along the back alley (alley trees split it into pockets; only the reachable pockets get used)
const docks = [{ c: 9, r: 8, bikes: 3 }, { c: 20, r: 8, bikes: 3 }];   // bikeshare, one each side of the plaza
const lamps = [[1, 6], [8, 6], [15, 6], [22, 6], [29, 6], [4, 10], [11, 10], [18, 10], [25, 10]];   // drawn at the top edge of road tiles
const flowers = [[9, 9], [10, 9], [19, 9], [20, 9], [9, 7], [20, 7]];
const SKY = 2;                                                   // alley row 2 runs behind the top row of buildings
const LANE = { c: 18, r: 15 };                                   // bus lane: rows 15-16 from col 18 to the right edge, entering from the bottom
const BUS_STOP = [22, 14], BUS_WAIT = [[21, 14], [22, 14], [23, 14]];
const blocked = new Set();
const key = (c, r) => c + ',' + r;
for (const b of buildings) for (let c = b.c; c < b.c + b.w; c++) for (let r = b.r; r < b.r + b.h; r++) blocked.add(key(c, r));
for (let c = 0; c < COLS; c++) { for (let r = 0; r < SKY; r++) blocked.add(key(c, r)); blocked.add(key(c, 16)); if (c >= LANE.c) blocked.add(key(c, LANE.r)); }   // sky, bottom row, bus lane
for (let c = 0; c < 2; c++) for (let r = 0; r < 2; r++) blocked.add(key(fountain.c + c, fountain.r + r));
for (let c = 0; c < pond.w; c++) for (let r = 0; r < pond.h; r++) blocked.add(key(pond.c + c, pond.r + r));
for (const [c, r] of trees) blocked.add(key(c, r));
const walkable = (c, r) => c >= 0 && r >= 0 && c < COLS && r < ROWS && !blocked.has(key(c, r));
const doorOf = b => [b.c + Math.floor(b.w / 2), b.r + b.h];       // tile just below the door
const walkTiles = []; { const seen = new Set([key(13, 9)]), q = [[13, 9]]; while (q.length) { const t = q.shift(); walkTiles.push(t); for (const [dc, dr] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const n = [t[0] + dc, t[1] + dr]; if (walkable(...n) && !seen.has(key(...n))) { seen.add(key(...n)); q.push(n); } } } }
const bType = t => buildings.filter(b => b.type === t);
const pondSide = walkTiles.filter(([c, r]) => r === 14 && c < pond.w);

function path(from, to) {                                    // BFS on tiles
  const start = key(...from), goal = key(...to); if (start === goal) return [];
  const prev = new Map([[start, null]]), q = [from];
  while (q.length) {
    const [c, r] = q.shift();
    for (const [dc, dr] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const n = [c + dc, r + dr], k = key(...n);
      if (!walkable(...n) || prev.has(k)) continue;
      prev.set(k, key(c, r)); if (k === goal) { const out = []; let cur = k; while (cur !== start) { out.unshift(cur.split(',').map(Number)); cur = prev.get(cur); } return out; }
      q.push(n);
    }
  }
  return null;
}

// ---------- people ----------
const PANIC = ['😱', '😨', '😰'];
const TOPICS = ['☕️', '🍕', '🐶', '🌧️', '💻', '🎮', '📺', '🚲', '🏠', '😂', '🤔', '💸', '🎂', '✈️', '📚', '🧦'];
const NAMES = ['ada', 'bo', 'cy', 'dot', 'eli', 'fay', 'gus', 'hal', 'ivy', 'jo', 'kit', 'lou', 'mo', 'nan', 'oz', 'pip'];
const people = [];
function addPerson(name) {
  const h = hash(name), home = bType('house')[h % bType('house').length], [c, r] = doorOf(home);
  const p = { name, home, c, r, x: c * T + 4, y: r * T + 4, route: [], act: 'idle', say: '', wait: rnd(0, 3), inside: null,
    shirt: `hsl(${h % 360} 55% 50%)`, hair: pick(['#2b1b0e', '#5a3b1e', '#d8b060', '#1a1a1a', '#8a2a2a', '#eee']), hat: h % 4 === 0, umbrella: h % 3 !== 0,
    frame: 0, flip: false, desc: 'standing around' };
  people.push(p); return p;
}
NAMES.forEach(n => addPerson(n));

// ---------- activities ----------
let mode = 'normal', modeUntil = 0;                // normal | incident | party | nap
function goTo(p, tile, act, desc, say = '') {
  const pth = path([p.c, p.r], tile); if (!pth) return false;
  p.route = pth; p.act = act; p.desc = desc; p.say = say; return true;
}
function enter(p, b, secs, desc) { p.inside = b; if (b.lit !== undefined) b.lit = true; p.wait = secs; p.desc = desc; p.act = 'inside'; }
function goHome(p, secs, desc) { const d = doorOf(p.home); return (p.c === d[0] && p.r === d[1]) ? enter(p, p.home, secs, desc) : goTo(p, d, 'walk', 'heading home'); }
function choose(p) {
  if (mode === 'incident') { const d = doorOf(p.home); if (p.c === d[0] && p.r === d[1]) return enter(p, p.home, 1e9, 'hiding at home'); return goTo(p, d, 'run', 'running home', pick(PANIC)); }
  if (mode === 'party') { const t = [ri(10, 19), ri(8, 9)]; if (walkable(...t)) goTo(p, t, 'walk', 'heading to the party'); p.wait = rnd(1, 3); return; }
  if (mode === 'nap') { p.act = 'idle'; p.desc = 'napping'; p.say = '💤'; p.wait = 5; return; }
  const n = night(), h = hourNow(), roll = Math.random();
  // routine by hour of day
  if (n > 0.6 && roll < 0.6) return goHome(p, rnd(20, 60), 'asleep at home');
  if (h >= 8 && h < 10 && roll < 0.45) return goTo(p, doorOf(pick(bType('office'))), 'walk', 'commuting to work');
  if (h >= 12 && h < 13.5 && roll < 0.4) return goTo(p, doorOf(pick(bType('cafe'))), 'walk', 'going for lunch');
  if (h >= 17 && h < 19 && roll < 0.35) return Math.random() < 0.5 ? goTo(p, doorOf(pick(bType('shop'))), 'walk', 'running an errand') : goHome(p, rnd(10, 30), 'home for the evening');
  // weather
  if (wet() && roll < 0.35) return Math.random() < 0.5 ? goTo(p, doorOf(pick(bType('cafe'))), 'walk', 'getting out of the ' + weather.type) : goHome(p, rnd(10, 30), 'staying dry at home');
  if (wet() && roll < 0.42) { const [c, r] = pick(trees); const spots = [[c, r + 1], [c - 1, r], [c + 1, r]].filter(t => walkable(...t)); if (spots.length) return goTo(p, pick(spots), 'walk', 'going to shelter under a tree'); }
  // everyday
  if (roll < 0.18) return goTo(p, pick(walkTiles), 'walk', 'out for a walk');
  if (roll < 0.30) return goTo(p, doorOf(pick(bType('cafe'))), 'walk', 'going for coffee');
  if (roll < 0.42) return goTo(p, doorOf(pick(bType('office'))), 'walk', 'going to work');
  if (roll < 0.50) return goTo(p, doorOf(pick(bType('shop'))), 'walk', 'running an errand');
  if (roll < 0.60) return goTo(p, pick(benches), 'walk', 'going to sit down');
  if (roll < 0.64) return goTo(p, pick([[13, 9], [16, 9], [13, 6], [16, 6]]), 'walk', 'going to look at the fountain');
  if (roll < 0.67) { const [c, r] = pick(trees); const spots = [[c, r + 1], [c - 1, r], [c + 1, r]].filter(t => walkable(...t)); if (spots.length) return goTo(p, pick(spots), 'walk', 'going to look at a tree'); }
  if (roll < 0.70) return goTo(p, pick(walkTiles.filter(([, r]) => r === SKY)), 'walk', 'going to look at the sky');
  if (roll < 0.75 && pondSide.length) return goTo(p, pick(pondSide), 'walk', 'going to feed the ducks');
  if (roll < 0.79) { const dog = nearestDog(p); const spots = spotsAround(dog.c, dog.r); if (spots.length) return goTo(p, pick(spots), 'walk', 'going to pet the dog'); }
  if (roll < 0.83 && bus.riders.length < 4) return goTo(p, pick(BUS_WAIT), 'walk', 'going to catch the bus');
  if (roll < 0.845 && SEASON !== 'winter' && pondSide.length) return goTo(p, pick(pondSide), 'walk', 'going fishing');
  if (roll < 0.875) { const d = pick(docks.filter(d => d.bikes > 0)); if (d) return goTo(p, [d.c, d.r], 'walk', 'going to grab a bike'); }
  if (roll < 0.93) {
    let g = pick(groups.filter(g => g.members.length < 5));
    if (!g) { const q = pick(people.filter(o => o !== p && o.act === 'idle' && !o.inside && !o.joining)); if (q) { g = { members: [q] }; groups.push(g); q.group = g; q.act = 'chat'; q.wait = rnd(10, 25); q.say = pick(TOPICS); q.nextSay = rnd(2, 5); q.desc = 'waiting to chat'; } }
    if (g) { const spot = chatSpot(g); if (spot) { p.joining = g; return goTo(p, spot, 'walk', 'going to chat'); } }
  }
  return goTo(p, doorOf(pick(bType('hall'))), 'walk', 'visiting town hall');
}
function arrived(p) {
  const here = buildings.find(b => { const d = doorOf(b); return d[0] === p.c && d[1] === p.r; });
  if (p.act === 'run') return enter(p, p.home, 1e9, 'hiding at home');
  if (p.joining) { const g = p.joining; p.joining = null; if (groups.includes(g)) { g.members.push(p); p.group = g; p.act = 'chat'; p.wait = rnd(8, 20); p.say = pick(TOPICS); p.nextSay = rnd(2, 5); faceGroup(g); return; } }
  if (p.desc === 'heading home') return enter(p, p.home, rnd(10, 40), night() > 0.6 ? 'asleep at home' : 'at home');
  if (here && /coffee|lunch|out of the/.test(p.desc)) return enter(p, here, rnd(3, 8), here.type === 'cafe' ? 'inside the cafe' : 'inside');
  if (here && /work/.test(p.desc)) return enter(p, here, rnd(15, 40), 'at work');
  if (here && /errand/.test(p.desc)) return enter(p, here, rnd(3, 8), 'shopping');
  if (here && /hall/.test(p.desc)) return enter(p, here, rnd(4, 10), 'inside town hall');
  if (/sit/.test(p.desc)) { p.act = 'sit'; p.desc = 'sitting on a bench'; p.wait = rnd(8, 20); return; }
  if (/fishing/.test(p.desc)) { p.act = 'fish'; p.desc = 'fishing'; p.wait = rnd(15, 35); p.fishT = rnd(3, 8); p.flip = false; return; }
  const dock = docks.find(d => d.c === p.c && d.r === p.r);
  if (p.bike && dock) { dock.bikes++; p.bike = false; p.say = '🚲'; p.act = 'idle'; p.desc = 'just docked a bike'; p.wait = rnd(1, 3); return; }
  if (/grab a bike/.test(p.desc) && dock) { if (dock.bikes > 0) { dock.bikes--; p.bike = true; const other = docks.find(d => d !== dock); if (goTo(p, [other.c, other.r], 'ride', 'riding a bike across town')) return; dock.bikes++; p.bike = false; } p.say = '😕'; p.desc = 'no bikes left'; p.act = 'idle'; p.wait = rnd(2, 4); return; }
  if (/shelter/.test(p.desc)) { p.desc = 'sheltering under a tree'; p.say = '☔️'; p.wait = rnd(8, 20); p.act = 'idle'; return; }
  if (/look at/.test(p.desc)) { p.desc = p.desc.replace('going to look at', 'looking at'); p.say = '👀'; p.wait = rnd(4, 8); p.act = 'idle'; return; }
  if (/ducks/.test(p.desc)) { p.desc = 'feeding the ducks'; p.say = '🍞'; p.wait = rnd(6, 12); p.act = 'idle'; p.flip = false; for (const d of ducks) d.lure = p; return; }
  if (/pet the dog/.test(p.desc)) { const dog = nearestDog(p); if (Math.hypot(dog.c - p.c, dog.r - p.r) <= 1.5) { p.desc = `petting ${dog.name}`; p.say = '🐶'; dog.say = '❤️'; dog.wait = 4; dog.route = []; dog.follow = p; } else { p.desc = 'looking for the dog'; p.say = '🤔'; } p.wait = rnd(3, 6); p.act = 'idle'; return; }
  if (/catch the bus/.test(p.desc)) { p.desc = 'waiting for the bus'; p.act = 'idle'; p.wait = rnd(40, 70); p.say = ''; return; }
  p.act = 'idle'; p.desc = 'standing around'; p.wait = rnd(1, 5);
}
// ---------- chat groups ----------
const groups = [];
const spotTaken = (g, c, r) => g.members.some(m => m.c === c && m.r === r) || people.some(o => o.joining === g && o.route.length && o.route.at(-1)[0] === c && o.route.at(-1)[1] === r);
function chatSpot(g) {                                        // free tile adjacent to someone in the group, beside them first
  const cands = [];
  for (const m of g.members) for (const [dc, dr] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const c = m.c + dc, r = m.r + dr; if (walkable(c, r) && !spotTaken(g, c, r)) cands.push([c, r, dr === 0 ? 0 : 1]); }
  cands.sort((a, b) => a[2] - b[2] || Math.random() - 0.5); return cands[0] ? [cands[0][0], cands[0][1]] : null;
}
function faceGroup(g) {
  const cx = g.members.reduce((s, m) => s + m.x, 0) / g.members.length;
  for (const m of g.members) { const names = g.members.filter(o => o !== m).map(o => o.name); m.desc = names.length ? `chatting with ${names.join(', ')}` : 'waiting to chat'; if (Math.abs(m.x - cx) > 1) m.flip = m.x > cx; }
}
function leaveGroup(p) {
  const g = p.group; if (!g) return; p.group = null; g.members = g.members.filter(m => m !== p);
  if (g.members.length <= 1) { for (const m of g.members) { m.group = null; m.act = 'idle'; m.say = ''; m.desc = 'standing around'; m.wait = rnd(1, 4); } groups.splice(groups.indexOf(g), 1); }
  else faceGroup(g);
}
function clearGroups() { for (const p of people) { p.group = null; p.joining = null; } groups.length = 0; }
function leave(p) {
  const b = p.inside; p.inside = null; if (b.lit !== undefined && !people.some(o => o.inside === b)) b.lit = false;
  p.say = b.type === 'cafe' ? '☕️' : b.type === 'shop' ? '🛍️' : b.type === 'office' ? pick(['💻', '😮‍💨', '📎']) : b.type === 'hall' ? '📜' : ''; p.act = 'idle'; p.desc = 'just stepped outside'; p.wait = rnd(1, 3);
}
function tick(p, dt) {
  p.frame += dt;
  if (p.route.length) {
    const [c, r] = p.route[0], tx = c * T + 4, ty = r * T + 4, sp = p.act === 'run' ? 48 : p.bike ? 42 : wet() ? 20 : 14, dx = tx - p.x, dy = ty - p.y, L = Math.hypot(dx, dy);
    if (dx) p.flip = dx < 0;
    if (wet() && p.umbrella && !p.say) p.say = weather.type === 'rain' ? '☔️' : '🧣';
    if (L <= sp * dt) { p.x = tx; p.y = ty; p.c = c; p.r = r; p.route.shift(); if (!p.route.length) { if (/☔️|🧣/.test(p.say)) p.say = ''; arrived(p); } }
    else { p.x += dx / L * sp * dt; p.y += dy / L * sp * dt; }
    return;
  }
  p.wait -= dt;
  if (p.act === 'fish' && p.wait > 0 && (p.fishT -= dt) <= 0) { const r = Math.random(); p.say = r < 0.25 ? pick(['🐟', '🐠']) : r < 0.32 ? '🥾' : ''; if (p.say === '🐟' || p.say === '🐠') for (const k of ducks) if (Math.random() < 0.5) k.say = '🎺'; p.fishT = rnd(3, 8); }
  if (p.act === 'chat' && p.wait > 0 && (p.nextSay -= dt) <= 0) { p.say = Math.random() < 0.8 ? pick(TOPICS) : ''; p.nextSay = rnd(2, 5); }
  if (p.wait > 0) return;
  p.say = '';
  if (p.group) leaveGroup(p);
  if (p.inside === bus) return;                                  // riders get off when the bus stops
  if (p.inside) { if (mode === 'incident') { p.wait = 2; return; } return leave(p); }
  if (choose(p) === false) p.wait = 1;
}

// ---------- dog, ducks, bus, birds, particles ----------
const DOGS = [  // temperament drives behaviour: lazy dogs lie around, loyal ones stick to people, wild ones chase, social ones hang around chats

  for (let x = 0; x < W; x += 3) px(x, 13 * T, `rgba(90,70,40,${n > 0.5 ? 0.5 : 0.8})`, 2, 1);                 // park path edge
  const water = PAL.snow && weather.type !== 'rain' ? `rgb(${170 - 60 * n},${200 - 70 * n},${225 - 80 * n})` : `rgb(${50 - 20 * n},${110 - 50 * n},${180 - 80 * n})`;
  const pr = pond.w * T, pt = pond.r * T;                                                                      // pond: a curved shoreline, off the left and bottom edges
  ctx.fillStyle = water; ctx.beginPath(); ctx.moveTo(0, pt + 2); ctx.quadraticCurveTo(pr * 0.35, pt - 2, pr * 0.6, pt + 1); ctx.quadraticCurveTo(pr - 2, pt + 3, pr, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = rgbn([120, 100, 60], n); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0, pt + 1.5); ctx.quadraticCurveTo(pr * 0.35, pt - 2.5, pr * 0.6, pt + 0.5); ctx.quadraticCurveTo(pr - 2.5, pt + 2.5, pr - 0.5, H); ctx.stroke();   // bank
  if (!PAL.snow) for (let i = 0; i < 6; i++) px((i * 37 + Math.floor(now / 400)) % (pond.w * T - 10), pond.r * T + 4 + (i * 5) % 10, 'rgba(255,255,255,0.35)', 3, 1);   // ripples
  const asphalt = `rgb(${84 - 38 * n},${86 - 38 * n},${92 - 38 * n})`;
  ctx.fillStyle = asphalt; ctx.beginPath(); ctx.moveTo(LANE.c * T, H); ctx.quadraticCurveTo(LANE.c * T, LANE.r * T, LANE.c * T + 16, LANE.r * T); ctx.lineTo(W, LANE.r * T); ctx.lineTo(W, H); ctx.closePath(); ctx.fill();   // lane curving up from the bottom
  ctx.strokeStyle = `rgb(${150 - 60 * n},${150 - 60 * n},${150 - 60 * n})`; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(LANE.c * T + 0.5, H); ctx.quadraticCurveTo(LANE.c * T + 0.5, LANE.r * T + 0.5, LANE.c * T + 16, LANE.r * T + 0.5); ctx.lineTo(W, LANE.r * T + 0.5); ctx.stroke();   // kerb line
  for (const [c, r] of flowers) if (SEASON !== 'winter') for (let i = 0; i < 3; i++) px(c * T + 1 + i * 3, r * T + 3 + (i % 2) * 2, SEASON === 'spring' ? pick(['#f7a', '#fd6', '#fff']) : SEASON === 'summer' ? '#e44' : '#c84', 1, 1);
  px(fountain.c * T + 1, fountain.r * T + 1, '#889', 14, 14); px(fountain.c * T + 3, fountain.r * T + 3, PAL.snow ? '#cde' : '#5ac', 10, 10);
  if (!PAL.snow) px(fountain.c * T + 7, fountain.r * T + 3 + Math.round(Math.sin(now / 90)), '#cff', 2, 4);
  for (const [c, r] of benches) { px(c * T + 1, r * T + 4, '#6b4a2a', 6, 2); px(c * T + 1, r * T + 6, '#4a3018', 1, 1); px(c * T + 6, r * T + 6, '#4a3018', 1, 1); }
  const drawables = [
    ...buildings.map(b => ({ y: (b.r + b.h) * T - 0.5, f: () => drawBuilding(b, n, now) })),
    { y: BUS_STOP[1] * T - 0.5, f: () => drawShelter(n) },
    ...people.map(p => ({ y: p.y, f: () => drawPerson(p, now) })),
    ...dogs.map(d => ({ y: d.y, f: () => drawDog(d) })),
    ...squirrels.map(q => ({ y: q.y, f: () => drawSquirrel(q) })),
    ...(geese.state === 'away' ? [] : geese.birds.map(g => ({ y: geese.state === 'landed' || (geese.state === 'landing' && Math.abs(g.gy - g.y) < 3) ? g.y + 1 : 1e9, f: () => drawGoose(g, now) }))),
    ...ducks.filter(d => !(d.air && d.air.phase === 'gone')).map(d => ({ y: d.air ? 1e9 : d.y, f: () => drawDuck(d, now) })),
    { y: bus.state === 'rising' ? H + 1 : bus.y + 1, f: drawBus },
    ...trees.map(([c, r]) => ({ y: r * T + 6, f: () => drawTree(c, r, n) })),
    ...docks.map(d => ({ y: d.r * T + 2, f: () => drawDock(d) })),
    ...lamps.map(([c, r]) => ({ y: r * T + 1, f: () => { px(c * T + 3, r * T - 7, '#345', 1, 8); px(c * T + 2, r * T - 8, n > 0.3 ? '#ffe28a' : '#9ab', 3, 2); if (n > 0.3) { ctx.fillStyle = `rgba(255,220,120,${0.12 * n})`; ctx.fillRect(c * T - 3, r * T - 6, 13, 12); } } })),
  ];
  drawables.sort((a, b) => a.y - b.y).forEach(d => d.f());
  for (const b of birds) { px(b.x, b.y, '#333', 1, 1); const fl = Math.floor(now / 260 + b.x / 15) % 2; px(b.x + (fl ? 1 : -1), b.y - 1, '#333', 1, 1); px(b.x + (fl ? -1 : 1), b.y - 1, '#333', 1, 1); }
  for (const f of particles) {
    if (f.k === 'rain') px(f.x, f.y, 'rgba(170,200,240,0.8)', 1, 3);
    else if (f.k === 'snow') px(f.x, f.y, '#fff');
    else if (f.k === 'smoke') px(f.x, f.y, `rgba(200,200,210,${clamp(f.t / 3, 0, 0.7)})`, 2, 2);
    else if (f.k === 'leaf') px(f.x, f.y, '#c84');
    else if (f.k === 'splash') px(f.x, f.y, 'rgba(210,235,255,0.9)');
    else if (f.k === 'petal') px(f.x, f.y, '#f9c');
    else px(f.x, f.y, f.c);
  }
  if (n > 0) { ctx.fillStyle = `rgba(10,12,40,${0.45 * n})`; ctx.fillRect(0, 0, W, H); }
  if (weather.type !== 'clear') { ctx.fillStyle = `rgba(60,70,90,${weather.type === 'cloudy' ? 0.12 : 0.22})`; ctx.fillRect(0, 0, W, H); }
  if (mode === 'incident') { ctx.fillStyle = 'rgba(120,20,30,0.18)'; ctx.fillRect(0, 0, W, H); }
  const d = new Date(); label(`${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')} ${WICON[weather.type]}`, 2, 5, 'rgba(255,255,255,0.85)', 5.5, 'left', true);
  if (now < tickerUntil) { ctx.fillStyle = '#000a'; ctx.fillRect(0, H - 9, W, 9); label(ticker.slice(0, 70), 2, H - 4.5, '#fff', 6, 'left'); }
}
// text drawn on the crisp overlay; (x, y) are world coordinates, size in world pixels
function label(text, x, y, color, size = 6, align = 'center', outline = true) {
  hctx.font = `${Math.round(size * S)}px ui-monospace, Menlo, 'Apple Color Emoji', 'Segoe UI Emoji', monospace`; hctx.textAlign = align; hctx.textBaseline = 'middle';
  if (outline) { hctx.lineWidth = Math.max(1, S * 0.45); hctx.lineJoin = 'round'; hctx.strokeStyle = 'rgba(0,0,0,0.8)'; hctx.strokeText(text, x * S, y * S); }
  hctx.fillStyle = color; hctx.fillText(text, x * S, y * S);
}

// ---------- loop ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if ((mode === 'party' || mode === 'nap') && now > modeUntil) onEvent({ type: 'wake' });
  for (const p of people) tick(p, dt);
  for (const d of dogs) tickDog(d, dt); for (const q of squirrels) tickSquirrel(q, dt); tickGeese(dt, now); tickDucks(dt); tickBus(dt); tickAmbient(dt, now);
  draw(now); requestAnimationFrame(loop);
}
fitOverlay();
requestAnimationFrame(loop);

// ---------- hover ----------
cv.onmousemove = e => {
  const r = cv.getBoundingClientRect(), mx = (e.clientX - r.left) * W / r.width, my = (e.clientY - r.top) * H / r.height;
  cursor.x = mx; cursor.y = my; cursor.active = true;
  const p = people.filter(p => !p.inside).map(p => ({ p, d: Math.hypot(p.x - mx, p.y + 2 - my) })).sort((a, b) => a.d - b.d)[0];
  const b = buildings.find(b => mx >= b.c * T && mx < (b.c + b.w) * T && my >= b.r * T && my < (b.r + b.h) * T);
  if (p && p.d < 5) tip.textContent = `${p.p.name} — ${p.p.desc}`;
  else if (dogs.some(d => Math.hypot(d.x - mx, d.y - my) < 5)) { const d = dogs.find(d => Math.hypot(d.x - mx, d.y - my) < 5); tip.textContent = `${d.name} (${d.temperament}) — ${d.desc}`; }
  else if (geese.state !== 'away' && geese.birds.some(g => Math.hypot(g.x - mx, g.y - my) < 5)) tip.textContent = `canada goose — ${geese.state === 'landed' ? 'occupying the park' : geese.state === 'leaving' ? 'leaving in a huff' : 'flying over'}`;
  else if (squirrels.some(q => !q.hidden && Math.hypot(q.x - mx, q.y - my) < 4)) tip.textContent = 'squirrel — making a run for it';
  else if (ducks.some(d => Math.hypot(d.x - mx, d.y - my) < 4)) tip.textContent = `duck — ${ducks.some(d => d.scared > 0) ? 'fleeing a dog' : ducks.some(d => d.lure) ? 'coming for bread' : 'paddling'}`;
  else if (bus.state !== 'away' && mx >= bus.x && mx < bus.x + bus.w && my >= bus.y - 14 && my < bus.y + 1) tip.textContent = `bus — ${bus.riders.length ? 'carrying ' + bus.riders.map(p => p.name).join(', ') : 'empty'}`;
  else if (my >= LANE.r * T && mx >= LANE.c * T) tip.textContent = 'bus lane';
  else if (my >= pond.r * T && mx < pond.w * T) tip.textContent = 'pond';
  else if (docks.some(d => Math.hypot(d.c * T + 4 - mx, d.r * T + 4 - my) < 5)) { const d = docks.find(d => Math.hypot(d.c * T + 4 - mx, d.r * T + 4 - my) < 5); tip.textContent = `bikeshare — ${d.bikes} bike${d.bikes === 1 ? '' : 's'} docked`; }
  else if (b) { const ins = people.filter(q => q.inside === b).map(q => q.name); tip.textContent = `${b.type}${ins.length ? ' — inside: ' + ins.join(', ') : ''}`; }
  else if (my < SKY * T) tip.textContent = `${SEASON}, ${weather.type}${southern ? ' (southern hemisphere)' : ''}`;
  else { tip.style.display = 'none'; return; }
  tip.style.display = 'block'; tip.style.left = e.clientX + 12 + 'px'; tip.style.top = e.clientY + 12 + 'px';
};
cv.onmouseleave = () => { tip.style.display = 'none'; cursor.active = false; };
</script>
</body>
</html>
